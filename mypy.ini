[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = False
strict_optional = False
# Interpret folders as packages so files with the same name are not seen as the same top-level module.
explicit_package_bases = True
namespace_packages = True
# Ignore import-untyped errors when type stubs are missing
# Type stubs are installed via requirements-test.txt in CI
disable_error_code = import-untyped

[mypy-tests.*]
ignore_errors = True

[mypy-scripts.*]
ignore_errors = True
