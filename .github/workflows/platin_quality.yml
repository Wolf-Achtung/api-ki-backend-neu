name: PLATIN+ Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  platin-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          fi
          # Fallback: pytest installieren, falls nicht in den Requirements
          pip install pytest

      - name: Run PLATIN+ test suite
        env:
          # Falls nötig, kannst du hier ENV-Flags setzen (z. B. LLM deaktivieren)
          ENABLE_LLM_CONTENT: "0"
        run: |
          pytest -q tests/test_platin_quality.py
