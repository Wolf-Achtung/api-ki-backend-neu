name: smoke

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve base URL
        id: resolve
        run: |
          if [ -n "${{ vars.BACKEND_BASE }}" ]; then
            echo "BASE_URL=${{ vars.BACKEND_BASE }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.BACKEND_BASE }}" ]; then
            echo "BASE_URL=${{ secrets.BACKEND_BASE }}" >> $GITHUB_ENV
          elif [ -n "${{ env.BACKEND_BASE }}" ]; then
            echo "BASE_URL=${{ env.BACKEND_BASE }}" >> $GITHUB_ENV
          else
            echo "::error ::BACKEND_BASE is not set (e.g. https://<railway-app>.up.railway.app)"
            exit 2
          fi
          echo "::notice ::Using \$BASE_URL for smoke tests"

      # KIS-1300: Ein Push auf main loest den Railway-Deploy aus. Der Smoke
      # lief eine Minute nach dem Merge gegen den Neustart und scheiterte
      # mit curl-Exit 22 (Lauf 7787595, 05.09.2026 13:42 UTC). Deshalb bis
      # zu vier Minuten auf /api/healthz warten, bevor geprueft wird.
      - name: Wait for /api/healthz (deploy window)
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "$BASE_URL/api/healthz" -o /dev/null; then
              echo "healthz ok after $i attempt(s)"
              exit 0
            fi
            echo "healthz not ready (attempt $i/24), waiting 10s"
            sleep 10
          done
          echo "::error ::/api/healthz not reachable within 4 minutes"
          exit 22

      - name: Ping /api/smoke
        run: |
          set -e
          curl -fsS "$BASE_URL/api/smoke" -o /dev/null

      - name: Ping /api/report/ping (optional)
        continue-on-error: true
        run: |
          curl -fsS "$BASE_URL/api/report/ping" -o /dev/null || echo "::warning ::/api/report/ping missing (optional)"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Smoke summary"
            echo ""
            echo "* Base URL: $BASE_URL"
            echo "* Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> $GITHUB_STEP_SUMMARY
