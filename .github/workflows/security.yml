name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    name: pip-audit (Python deps)
    # KIS-1271: hashFiles() ist auf Job-Ebene nicht erlaubt (Invalid workflow
    # file bei jedem main-Push seit PR #1058). Die Steps pruefen die Dateien
    # ohnehin selbst per [ -f ... ] — Job-Level-Guard ersatzlos entfernt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pip-audit
        run: pip install --upgrade pip-audit
      - name: pip-audit (production)
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --strict
          fi
          if [ -f pyproject.toml ]; then
            pip-audit --strict
          fi
      - name: pip-audit (test deps - warning only)
        continue-on-error: true
        run: |
          if [ -f requirements-test.txt ]; then
            pip-audit -r requirements-test.txt
          fi
          if [ -f requirements-e2e.txt ]; then
            pip-audit -r requirements-e2e.txt
          fi

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install bandit
        run: pip install --upgrade bandit
      # KIS-1271: Zweistufig — Mediums sichtbar (informativ), Highs blockieren.
      # Die 4 bekannten B701-autoescape-Stellen sind mit begruendetem nosec
      # annotiert (Templates rendern serverseitige HTML-Sektionen by design).
      - name: Bandit report (medium+, informational)
        run: bandit -r . -ll --exclude='./venv,./.git,./.audit-temp,./tests,./scripts' --exit-zero
      - name: Run bandit (HIGH severity gate)
        run: bandit -r . --severity-level high --exclude='./venv,./.git,./.audit-temp,./tests,./scripts'
